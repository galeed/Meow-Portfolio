# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Person to greet'
        # Default value if no value is explicitly provided
        default: 'World'
        # Input has to be provided for the workflow to run
        required: true
        # The data type of the input
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  greet:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Runs a single command using the runners shell
    - name: Send greeting
      run: echo "Hello ${{ inputs.name }}"
- name: Upload a Build Artifact
  uses: actions/upload-artifact@v7.0.2
  with:
    # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
    name: # optional, default is artifact
    # A file, directory or wildcard pattern that describes what to upload.
    path: 
    # The desired behavior if no files are found using the provided path.
Available Options:
  warn: Output a warning but do not fail the action
  error: Fail the action with an error message
  ignore: Do not output any warnings or errors, the action does not fail

    if-no-files-found: # optional, default is warn
    # Duration after which artifact will expire in days. 0 means using default retention.
Minimum 1 day. Maximum 90 days unless changed from the repository settings page.

    retention-days: # optional
    # The level of compression for Zlib to be applied to the artifact archive. The value can range from 0 to 9: - 0: No compression - 1: Best speed - 6: Default compression (same as GNU Gzip) - 9: Best compression Higher levels will result in better compression, but will take longer to complete. For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.

    compression-level: # optional, default is 6
    # If true, an artifact with a matching name will be deleted before a new one is uploaded. If false, the action will fail if an artifact for the given name already exists. Does not fail if the artifact does not exist.

    overwrite: # optional, default is false
    # If true, hidden files will be included in the artifact. If false, hidden files will be excluded from the artifact.

    include-hidden-files: # optional, default is false
    # If true, the artifact will be archived (zipped) before uploading. If false, the artifact will be uploaded as-is without archiving. When `archive` is `false`, only a single file can be uploaded. The name of the file will be used as the artifact name (ignoring the `name` parameter).

    archive: # optional, default is true


- name: Zimperium zScan
  # You may pin to the exact commit or the version.
  # uses: Zimperium/zScanMarketplace@8c1dff6166b6e25c59520480a766985f5eef3f8a
  uses: Zimperium/zScanMarketplace@v1.6
  with:
    # Zimperium Console URL
    console_url: # optional
    # DEPRECATED: Zimperium Console Client Environment Mnemonic
    client_env: # optional
    # zScan API Client ID
    client_id: 
    # zScan API Client Secret
    client_secret: 
    # APK or IPA File(s) to Scan
    app_file: 
    # Team name to assign the app to (default: Default)
    team_name: # optional, default is Default
    # Report format to download: json, sarif, or pdf (default: sarif)
    report_format: # optional, default is sarif
    # Fail the workflow when scan findings meet the configured criteria
    fail_on_scan_findings: # optional, default is false
    # Scan evaluation mode: any_finding or unaccepted_finding_only (default: any_finding)
    scan_evaluation_mode: # optional, default is any_finding
    # Minimum severity for scan evaluation: informational, low, medium, high, or critical (default: low)
    minimum_severity: # optional, default is low

    - name: QAWolf Greenlight
  # You may pin to the exact commit or the version.
  # uses: prodigyeducation/qawolf-greenlight@76b2dee8bdf55c2369ade680aec7576081cf050f
  uses: prodigyeducation/qawolf-greenlight@v1.0.1
  with:
    # API Key on QAWolf
    qawolf-api-key: 
    # DeployConfig for QAWolf.attemptNotifyDeploy.
    qawolf-notification-config: # default is {}
    # Timeout in seconds
    timeout: # optional, default is 600
    # Interval to check for status
    interval: # optional, default is 30

    - name: Validation Action
  # You may pin to the exact commit or the version.
  # uses: tmknom/validation-action@5b02f433dbf60c99846bd2c571566dcd74993291
  uses: tmknom/validation-action@v0.2.1
  with:
    # The value to validate.
    value: 
    # Validates whether the input value is not empty.
    not-empty: # optional
    # Validates whether the input value contains only digits (0-9).
    digit: # optional
    # Validates whether the input value contains only English letters (a-zA-Z).
    alpha: # optional
    # Validates whether the input value contains only English letters and digits (a-zA-Z0-9).
    alphanumeric: # optional
    # Validates whether the input value contains only ASCII characters.
    ascii: # optional
    # Validates whether the input value contains only printable ASCII characters.
    printable-ascii: # optional
    # Validates whether the input value is an integer.
    int: # optional
    # Validates whether the input value is a floating-point number.
    float: # optional
    # Validates whether the input value is a valid URL.
    url: # optional
    # Validates whether the input value is a valid email address.
    email: # optional
    # Validates whether the input value is a valid semantic version.
    semver: # optional
    # Validates whether the input value is valid Base64.
    base64: # optional
    # Validates whether the input value is valid JSON.
    json: # optional
    # Validates whether the input value's length is exactly equal to the specified number.
    exact-length: # optional
    # Validates whether the input value's length is greater than or equal to the specified minimum.
    min-length: # optional
    # Validates whether the input value's length is less than or equal to the specified maximum.
    max-length: # optional
    # Validates whether the input value is greater than or equal to the specified minimum.
    min: # optional
    # Validates whether the input value is less than or equal to the specified maximum.
    max: # optional
    # Validates whether the input value matches any of the specified enumerations.
    enum: # optional
    # Validates whether the input value matches a timestamp format [rfc3339, datetime, date, time].
    timestamp: # optional
    # Validates whether the input value matches the specified regular expression.
    pattern: # optional
